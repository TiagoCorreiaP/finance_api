<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANOB | Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="registerForm" class="card">
    <div class="brand">
        <i class="fa-solid fa-wallet"></i>
        <h2>PLANO<span>B</span></h2>
    </div>
    <p class="subtitle">Crie sua conta para liberar o acesso</p>

    <div class="input-group">
        <label>Nome Completo</label>
        <input type="text" id="full_name" required>
    </div>
    <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="email" required>
    </div>
    <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" required>
    </div>
    <div class="input-row">
        <div class="input-group">
            <label>Telefone</label>
            <input type="text" id="phone">
        </div>
        <div class="input-group">
            <label>Nascimento</label>
            <input type="date" id="birth_date">
        </div>
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Finalizar Cadastro</button>
</form>

<div id="successArea" class="card hidden">
    <h2>✅ Sucesso!</h2>
    <p>Agora você pode baixar o arquivo.</p>
    <a href="#" class="btn-download">Baixar PLANOB</a>
</div>

<script>
    window.onload = function() {
        const form = document.getElementById('registerForm');
        const successArea = document.getElementById('successArea');

        if (!form) {
            console.error("Mano, o JS não achou o formulário 'registerForm'!");
            return;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("Botão clicado! Preparando dados...");

            const payload = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value || "",
                birth_date: document.getElementById('birth_date').value || null
            };

            try {

                const response = await fetch('http://localhost:9999/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    console.log("API respondeu OK!");
                    form.classList.add('hidden');
                    successArea.classList.remove('hidden');
                    successArea.style.display = 'block'; 
                } else {
                    const error = await response.json();
                    console.error("A API recusou:", error);
                    alert("Formato de Email inválido!");
                }
            } catch (err) {
                console.error("Erro fatal de conexão:", err);
                alert("Não conectou na API. O Docker está rodando na porta 9999?");
            }
        });
    };
</script>
</body>
</html>
