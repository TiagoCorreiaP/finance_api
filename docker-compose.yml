version: '3.8'

services:
  db:
    image: mysql:latest
    container_name: mysql-financas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tiago.correia
      MYSQL_DATABASE: db_financas
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: finance-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  mysql_data: